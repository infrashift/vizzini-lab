# Generated by vizzini-uat uat/ci-github.sh from Vizzini's deploy/ci/github/vizzini-bot.yml;
# the only change: stubllm, started in the job, is the model.
name: vizzini-bot
'on':
  pull_request:
    types:
    - opened
    - synchronize
    - reopened
    - ready_for_review
permissions:
  contents: read
  pull-requests: write
concurrency:
  group: vizzini-bot-${{ github.event.pull_request.number }}
  cancel-in-progress: false
env:
  VIZZINI_REF: 517e4344db8f2dfd1174c1473cd31c5e1add2f0b
  MRMAN_VERSION: v0.1.6
  GARMR_REF: bf96753b9123fc9ac667afed84eba1610d896c53
jobs:
  review:
    if: github.event.pull_request.head.repo.full_name == github.repository && !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - name: Check out the pull request (full history, for incremental review)
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ github.event.pull_request.head.sha }}
        fetch-depth: 0
        persist-credentials: false
    - name: Check out Vizzini at the pinned commit
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: infrashift/vizzini-pr-reviewer
        ref: ${{ env.VIZZINI_REF }}
        path: .vizzini-src
        persist-credentials: false
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
      with:
        go-version-file: .vizzini-src/go.mod
        cache: false
    - name: Install vizzini-bot, mrman and garmr (pinned, verified)
      run: '.vizzini-src/deploy/ci/install.sh "$RUNNER_TEMP/vizzini"

        echo "$RUNNER_TEMP/vizzini/bin" >> "$GITHUB_PATH"

        echo "TIKTOKEN_CACHE_DIR=$RUNNER_TEMP/vizzini/tiktoken" >> "$GITHUB_ENV"

        '
    - name: Start stubllm as the model (vizzini-uat test only)
      run: '(cd .vizzini-src && go build -o "$RUNNER_TEMP/stubllm" ./scripts/e2e/stubllm)

        nohup "$RUNNER_TEMP/stubllm" -addr 127.0.0.1:18765 -finding-per-file >"$RUNNER_TEMP/stubllm.log"
        2>&1 &

        for _ in $(seq 50); do curl -s -o /dev/null http://127.0.0.1:18765/ && break;
        sleep 0.2; done

        '
    - name: Review
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        VIZZINI_LITELLM_URL: http://127.0.0.1:18765/v1
        VIZZINI_MODEL: stub
        VIZZINI_API_KEY: ''
        BASE_REF: ${{ github.base_ref }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        PR_URL: ${{ github.event.pull_request.html_url }}
        PR_KEY: github:github.com/${{ github.repository }}#${{ github.event.pull_request.number
          }}
        REQUESTER: ${{ github.event.pull_request.user.login }}
      run: "vizzini-bot \\\n  --repo . --base \"origin/$BASE_REF\" --head \"$HEAD_SHA\"\
        \ --pr-url \"$PR_URL\" \\\n  --grant-policy .vizzini/grant-policy \\\n  --pr\
        \ \"$PR_KEY\" --requester \"$REQUESTER\" \\\n  --out \"$RUNNER_TEMP/vizzini-review.json\"\
        \n"
